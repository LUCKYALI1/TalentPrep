<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- Primary Telemetry & Brand Metadata -->
    <title>TalentPrep AI — Autonomous Mock Interviews & STAR Telemetry</title>
    <meta 
      name="description" 
      content="Autonomous AI mock interview preparation platform with real-time conversational speech capture, ATS alignment scoring, and Gemini-calibrated STAR rubrics." 
    />
    <meta name="keywords" content="AI Mock Interview, Tech Interview Prep, STAR Method, ATS Optimizer, Speech Telemetry, Software Engineer Interview" />
    <meta name="author" content="TalentPrep AI" />

    <!-- Browser Chrome & Mobile Status Bar Theming -->
    <meta name="theme-color" content="#050507" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!-- Open Graph & Social Cards -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TalentPrep AI — Autonomous Mock Interviews" />
    <meta property="og:description" content="Ace technical interviews with real-time speech diagnostics, STAR feedback, and ATS scoring." />
    <meta property="og:site_name" content="TalentPrep" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon-32x32.png" />

    <!-- Typography Preconnections: Inter (UI) & JetBrains Mono (Telemetry) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link 
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" 
      rel="stylesheet" 
    />

    <!-- Flash-of-White Prevention & Base Canvas Styles -->
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html, body {
        background-color: #050507;
        color: #f4f4f5;
        margin: 0;
        padding: 0;
        min-height: 100%;
        overflow-x: hidden;
      }
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      code, kbd, samp, pre {
        font-family: 'JetBrains Mono', monospace;
      }
    </style>
  </head>
  <body class="bg-[#050507] text-zinc-100 antialiased selection:bg-cyan-500/25 selection:text-cyan-200">
    <!-- Application Mount Node -->
    <div id="root" class="w-full min-h-[100dvh] flex flex-col"></div>

    <!-- Application Entry Point -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
